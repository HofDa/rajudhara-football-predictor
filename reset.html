<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rajudhara Reset</title><style>body{font-family:system-ui;background:#eef2ef;color:#17231e;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:600px;padding:30px;border-radius:20px;background:#fff;box-shadow:0 18px 55px rgba(25,56,38,.12)}button{border:0;border-radius:999px;padding:12px 18px;background:#102f24;color:#fff;font-weight:800}</style></head><body><main class="card"><h1 id="title">App-Cache zurücksetzen</h1><p id="status">Service Worker, Cache und lokale App-Daten werden entfernt.</p><button id="reset">Jetzt zurücksetzen</button></main><script>
const texts={de:{title:'App-Cache zurücksetzen',intro:'Service Worker, Cache und lokale App-Daten werden entfernt.',button:'Jetzt zurücksetzen',done:'Zurückgesetzt. Die aktuelle App wird neu geladen.',error:'Fehler: '},en:{title:'Reset app cache',intro:'Service worker, cache and local app data will be removed.',button:'Reset now',done:'Reset complete. The current app is reloading.',error:'Error: '}};
const lang=(()=>{try{const stored=localStorage.getItem('rfp.lang.v3');if(texts[stored])return stored}catch{}const preferred=(navigator.languages||[navigator.language||'de']).map(tag=>String(tag).slice(0,2).toLowerCase());return preferred.find(code=>texts[code])||'de'})();
const text=texts[lang];document.documentElement.lang=lang;document.getElementById('title').textContent=text.title;document.getElementById('status').textContent=text.intro;document.getElementById('reset').textContent=text.button;
async function reset(){const status=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}Object.keys(localStorage).filter(key=>(key.startsWith('rfp.')||key.startsWith('gl.'))&&key!=='rfp.lang.v3').forEach(key=>localStorage.removeItem(key));status.textContent=text.done;setTimeout(()=>location.replace('./?reset='+Date.now()),800)}catch(error){status.textContent=text.error+error.message}}
document.getElementById('reset').onclick=reset;
</script></body></html>
